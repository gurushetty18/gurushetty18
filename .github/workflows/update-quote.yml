name: Update Thought of the Day

# Disabled by default — your README currently uses a fixed quote
# ("Risk is better than regret."), so this workflow is optional.
# Uncomment the schedule/push triggers below if you want the quote
# to rotate automatically instead.

on:
  workflow_dispatch:      # manual trigger only, for now
  # schedule:
  #   - cron: '0 0 * * *'  # once a day at midnight UTC
  # push:
  #   branches: [main]

jobs:
  update-quote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pick a new quote and update README
        run: node update-quote.js

      - name: Commit and push if README changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet --cached || git commit -m "chore: rotate thought of the day"
          git push
